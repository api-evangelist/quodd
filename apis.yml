aid: quodd
url: https://raw.githubusercontent.com/api-evangelist/quodd/refs/heads/main/apis.yml
name: QUODD
kind: company
description: >-
  QUODD is a cloud-native market data provider delivering real-time, delayed,
  historical, end-of-day, and point-in-time pricing, plus reference data, a
  security master, fundamentals, estimates, corporate actions, ESG, and news
  across global equities, ETFs, options, fixed income, FX, funds, and indices.
  The QUODD Developer Platform (developer.quodd.com) exposes market data through
  REST and gRPC snapshot APIs, token-based authentication, and cloud delivery
  options - Cloud APIs, Cloud Streaming, Cloud Alerts, Cloud Search, and Cloud
  Files. QUODD advertises more than 250 billion data points across 150-plus
  global exchanges. Developer documentation is public, but production access is
  gated behind trial or firm credentials and enterprise contact-sales
  agreements; exact REST base URLs and full endpoint paths are not published
  openly.
