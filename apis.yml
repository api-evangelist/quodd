- aid: quodd:quodd-cloud-streaming-api
  name: QUODD Cloud Streaming API
  tags:
  - Real-Time Data
  - Streaming
  - Market Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.quodd.com/advanced-api-delivery
  baseURL: https://api.quodd.com
  properties:
  - url: https://www.quodd.com/advanced-api-delivery
    type: Documentation
  description: >-
    Cloud Streaming pushes changing quote and trade fields continuously rather
    than requiring repeated REST polling, for live market data in servers, web,
    and mobile apps. QUODD's own developer platform does not publicly document
    the streaming transport (no wss:// endpoint is published); third-party
    WebSocket access to QUODD feeds is documented via Intrinio's Real-Time SDK.
    Access is gated behind enterprise agreements.
