meters:
- name: dataset_entitlements
  description: Licensed datasets and asset classes (real-time, delayed, historical, reference, fundamentals) under the agreement.
  unit: datasets
  aggregation: sum
  dimensions:
  - account
  - dataset
- name: exchange_licensing
  description: Exchange market-data licensing fees passed through per venue, varying by display/non-display and internal/external distribution.
  unit: subscriptions
  aggregation: sum
  dimensions:
  - account
  - exchange
- name: delivery_method
  description: Delivery channel consumed - Cloud APIs (REST), Cloud Streaming, Cloud Files, or gRPC.
  unit: channels
  aggregation: sum
  dimensions:
  - account
  - channel
principles:
- name: Visibility
  description: Track dataset entitlements and exchange licensing separately; exchange pass-through fees are often the largest and most variable line item.
- name: Allocation
  description: Map licensed datasets, exchanges, and delivery channels to the teams and products that consume them.
- name: Optimization
  description: License only the exchanges and asset classes actually needed; prefer delayed over real-time where acceptable; use batch snapshots and streaming to reduce redundant calls; scope historical pulls.
- name: Accountability
  description: Assign an owner for the market-data contract; review entitlements and exchange fees against usage on a recurring basis.
