description: >-
  FinOps view of QUODD market data spend. QUODD does not publish public rates;
  cost is contractual and driven primarily by which datasets and asset classes
  are licensed (real-time vs delayed vs historical vs reference), the delivery
  method (Cloud APIs, Cloud Streaming, Cloud Files, gRPC), whether data is used
  internally or redistributed/displayed, and the exchange market-data licensing
  fees passed through from each venue. Those exchange fees are frequently the
  largest and most variable component of total market-data cost.
notes: >-
  Per-unit rates are not reconciled here. The dominant cost drivers are dataset
  entitlements and exchange licensing (display vs non-display, internal vs
  external distribution), not per-API-call fees. Confirm the fee schedule and
  exchange pass-throughs directly with QUODD.
