notes: >-
  The gRPC streaming connection (GetSnapsStream) stays open while market data is
  available and is terminated automatically after 30 minutes without active
  data; clients are required to implement reconnection logic. Ticker symbology
  supports extensions .D (delayed), .NB (Nasdaq Basic), and .NB.D (Nasdaq Basic
  delayed).
