description: >-
  Index of QUODD's published gRPC service definitions. QUODD publishes real
  proto3 files (with client code examples in C#, Go, Node, and Ruby) as
  downloadable zip bundles on the QUODD Developer Platform. The .proto files in
  this directory are saved verbatim from those bundles. All services are served
  at api.quodd.com:443 and require a JWT bearer token in gRPC metadata; the Snap
  service additionally requires an AssetType metadata header (Equities or
  Options).
